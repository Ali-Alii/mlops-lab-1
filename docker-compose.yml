name: food11-lab4

services:
  mlflow:
    build: ./mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  inference:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_URI: models:/food11@champion
      MLFLOW_DISABLE_AGENT_HINT: "1"
      GIT_PYTHON_REFRESH: quiet
    command:
      - sh
      - -c
      - python -m src.food11.bootstrap && exec uvicorn src.food11.serve:app --host 0.0.0.0 --port 8000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow-data:
